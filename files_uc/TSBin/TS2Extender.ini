[General]
; Show debug console.
Console = false
; Replaces regular exclusive fullscreen with borderless.
Borderless = true
; Skips intro videos.
SkipIntro = true

[Enhancements]
; Allows choosing separates (tops, bottoms, outfits) in CAS on all clothing categories.
Separates4All = false
; In Create-A-Sim, lets you edit your Sim's personality without refreshing their zodiac sign.
FreeZodiac = false
; 0 = Default Shadows (128px)
; 1 = Medium Shadows (256px)
; 2 = High Shadows (512px)
; 3 = Ultra Shadows (1024px) (Expensive)
ShadowQuality = 0
; 0 = Default lot imposters
; 1 = Medium lot imposters
; 2 = High lot imposters
; 3 = Ultra lot imposters (Expensive)
ImposterQuality = 0
; Price of the object design tool (15 by default)
DesignToolPrice = 15

; Implements a smoother, more modern gameplay orbit camera.
[Sims 3 Camera]
Enabled = false
; Sensitivity can be negative to invert axes.
XSensitivity = 1.0
YSensitivity = 1.0

[Fixes]
; Fixes firstborn syndrome and other uninitialized random seeds.
FixRNG = true
; Fixes OFB employees having default faces when changing their uniform. Requires the "ld_TS2Extender_uniformFix.package" file to be in your "Documents/The Sims 2/Downloads" folder in order to work.
FixOFBUniform = true
; Fixes a Maxis oversight that causes pink flashing due to Large Address Aware. Thanks to @spockthewok on GitHub for discovering this.
FixPinkFlashing = true
; Fixes lag when using the overlays/makeup/accessories section in CAS.
FixMakeupLag = true
; Fixes pool shadows breaking on daytime change.
FixPoolShadows = true
; Fixes outdoor shadows getting cut off when "Use Square Pixels" is enabled.
FixOutdoorShadows = true
; Fixes the sun and moon duplicating on weather/time of day changes.
FixSun = true

[Misc]
; Uses female UI Poses for female Sims in chance cards and other dialogs instead of forcing male poses.
GenderedThumbnails = true

[Splash]
; Shows a random splash screen .PNG from TSBin/Splash folder while the game window is loading.
Enabled = true
; How much of your vertical resolution should the splash screen cover.
VerticalCoverage = 0.5

[Advanced]
; Adds a whole lot of new Lua features and restores sandboxed functionality. Plus makes print() log to the debug console. Check https://lazyduchess.github.io/TS2-Extender-Docs/ for documentation.
ExtendedLua = true
; Increases BHAV max iterations and reduces object errors.
ExtendedSimAntics = true
; Force the game code to run on a single hardware thread, if you need that for some reason.
SingleCore = false

[Legacy]
; Legacy hack - enables ocean reflections.
; Use https://github.com/spockthewok/TS2ReflectiveWater instead for a much better alternative.
OceanReflections = false